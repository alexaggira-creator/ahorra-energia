<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="washerBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="washerLid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="panelDisplay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect x="0" y="0" width="400" height="300" fill="#f8fafc" rx="12" />

  <!-- Silueta Lavadora de Carga Superior -->
  <g transform="translate(130, 25)">
    <!-- Base y patas -->
    <rect x="15" y="225" width="20" height="8" fill="#475569" rx="2" />
    <rect x="105" y="225" width="20" height="8" fill="#475569" rx="2" />

    <!-- Chasis principal -->
    <rect x="5" y="20" width="130" height="205" fill="url(#washerBody)" rx="8" stroke="#1e293b" stroke-width="2" />

    <!-- Tapa superior biselada -->
    <polygon points="5,20 15,5 125,5 135,20" fill="#1e293b" stroke="#0f172a" stroke-width="1.5" />
    <ellipse cx="70" cy="12" rx="35" ry="5" fill="#38bdf8" opacity="0.3" />

    <!-- Panel de control trasero inclinado -->
    <rect x="15" y="28" width="110" height="35" fill="#0f172a" rx="4" stroke="#475569" stroke-width="1" />
    <!-- Pantalla digital LED -->
    <rect x="45" y="34" width="50" height="15" fill="#020617" rx="2" />
    <text x="70" y="45" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle">19 kg</text>
    <circle cx="28" cy="42" r="6" fill="#64748b" />
    <circle cx="108" cy="42" r="5" fill="#3b82f6" />

    <!-- Tapa de vidrio templado -->
    <rect x="20" y="70" width="100" height="75" fill="url(#washerLid)" rx="6" stroke="#475569" stroke-width="1.5" />
    <!-- Visor de tambor -->
    <ellipse cx="70" cy="107" rx="35" ry="25" fill="#0284c7" opacity="0.25" stroke="#38bdf8" stroke-width="1" />
    <circle cx="70" cy="107" r="14" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />

    <!-- Textos de marca y modelo -->
    <text x="70" y="170" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#f8fafc" text-anchor="middle">SAMSUNG</text>
    <text x="70" y="183" font-family="Arial, sans-serif" font-size="7" fill="#94a3b8" text-anchor="middle">WA19T6260BV</text>

    <!-- Badge Digital Inverter -->
    <rect x="35" y="195" width="70" height="16" fill="url(#panelDisplay)" rx="3" />
    <text x="70" y="206" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#ffffff" text-anchor="middle">DIGITAL INVERTER</text>
  </g>

  <!-- Ficha informativa Izquierda: Ficha oficial Samsung -->
  <rect x="10" y="30" width="115" height="75" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="67" y="48" font-family="Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Ficha Oficial Samsung</text>
  <text x="67" y="64" font-family="Arial, sans-serif" font-size="8" fill="#0284c7" text-anchor="middle" font-weight="bold">144 kWh / año</text>
  <text x="67" y="77" font-family="Arial, sans-serif" font-size="7.5" fill="#334155" text-anchor="middle">Capacidad: 19 kg</text>
  <text x="67" y="90" font-family="Arial, sans-serif" font-size="7" fill="#64748b" text-anchor="middle">Pruebas estandarizadas</text>

  <!-- Ficha informativa Derecha: Calculo normativo semanal -->
  <rect x="275" y="30" width="115" height="75" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="332" y="48" font-family="Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Uso y Prorrateo</text>
  <text x="332" y="64" font-family="Arial, sans-serif" font-size="7.5" fill="#334155" text-anchor="middle">144 kWh ÷ 52 sem</text>
  <text x="332" y="77" font-family="Arial, sans-serif" font-size="7.5" fill="#334155" text-anchor="middle">Horario: 1 h / día</text>
  <text x="332" y="90" font-family="Arial, sans-serif" font-size="7.5" fill="#16a34a" text-anchor="middle" font-weight="bold">2,77 kWh / sem</text>

  <!-- Pie de ilustración -->
  <rect x="15" y="260" width="370" height="26" rx="4" fill="#e2e8f0" />
  <text x="200" y="277" font-family="Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle">
    Ilustración técnica referencial · Ficha Samsung: 144 kWh/año (WA19T6260BV)
  </text>
</svg>
